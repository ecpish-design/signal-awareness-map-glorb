<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a233b" />
  <meta name="description" content="GLORB Signal Mapper — a student-led way to map feelings, what can change them, and what helps." />
  <title>GLORB // Signal Mapper</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="appShell" class="app-shell">
    <header class="topbar" aria-label="Main navigation">
      <div class="brand">ZORBAX-9 RESEARCH DIVISION</div>
      <nav class="topnav" aria-label="Signal Mapper controls">
        <button id="backBtn" class="nav-btn" type="button" hidden>← BACK</button>
        <button id="infoBtn" class="nav-btn" type="button">ⓘ MORE INFORMATION</button>
        <button id="readBtn" class="nav-btn" type="button">🔊 READ ALOUD</button>
        <button id="exitBtn" class="nav-btn" type="button">PRINT / SHARE &amp; EXIT</button>
        <button id="restartBtn" class="nav-btn" type="button">START OVER</button>
      </nav>
    </header>
    <div class="global-progress" aria-hidden="true"><span id="globalProgressBar"></span></div>
    <main id="app" class="app-main" tabindex="-1"></main>
  </div>
  <div id="modalRoot"></div>
  <div id="reportRoot" class="report-root" aria-hidden="true"></div>
  <script src="data.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"
          integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
